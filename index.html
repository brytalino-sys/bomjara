<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<title>Бомжара: путь наверх</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#14161c;--card:#1e222b;--card2:#2a303d;--text:#e9ebf2;--muted:#8a92a6;--gold:#f5b942;--good:#4ade80;--bad:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
input{font:inherit}
#app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:8px;padding:10px 12px calc(76px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:6px}
.stagechip{flex:1;min-width:0;background:var(--card);padding:7px 10px;border-radius:12px;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{background:var(--card);padding:7px 9px;border-radius:12px;font-size:12px;white-space:nowrap}
.money{background:var(--card);padding:7px 10px;border-radius:12px;font-weight:700;color:var(--gold);font-size:13px;white-space:nowrap}
.muted{color:var(--muted);font-size:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}
.stat{background:var(--card);border-radius:12px;padding:5px 9px}
.stat .row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:3px}
.stat .row b{color:var(--text)}
.stat .bar{height:6px;background:#0f1116;border-radius:5px;overflow:hidden}
.stat .bar i{display:block;height:100%;border-radius:5px;transition:width .3s}
.stat.low .bar i{animation:pulse .8s infinite alternate}
.stat.low .row b{color:var(--bad)}
@keyframes pulse{to{opacity:.35}}
.goalbox{background:var(--card);border-radius:14px;padding:9px 11px;border:1px solid #2c3342}
.goalbox .gt{font-size:12px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.gi{display:flex;align-items:center;gap:6px;font-size:13px;margin:3px 0}
.gi .pb{flex:1;height:6px;background:#0f1116;border-radius:4px;overflow:hidden;min-width:40px}
.gi .pb i{display:block;height:100%;background:linear-gradient(90deg,#f5b942,#f59e0b)}
.gi .v{color:var(--muted);font-size:11px;white-space:nowrap}
.gi.done{color:var(--good)}
.log{background:var(--card);border-radius:14px;padding:7px 10px;min-height:76px;max-height:112px;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.log div{font-size:12.5px;opacity:.55;line-height:1.3}
.log div:last-child{opacity:1}
.log .good{color:var(--good)}.log .bad{color:var(--bad)}
.box{background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:13px;line-height:1.4}
.sec{margin:8px 0 4px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.act{background:var(--card2);border-radius:14px;padding:9px;text-align:left;display:grid;grid-template-columns:28px 1fr;column-gap:7px;align-items:center;min-height:56px}
.act:active:not(:disabled){transform:scale(.97)}
.act .ic{font-size:22px;grid-row:span 2}
.act b{font-size:13px;line-height:1.15}
.act small{color:var(--muted);font-size:10.5px;line-height:1.2}
.act:disabled{opacity:.4}
.act.big{grid-column:1/-1}
.act.win{background:linear-gradient(90deg,#15803d,#22c55e);color:#04210f}
.act.win small{color:#064e24}
.act.red{background:#5b2230}
.mini{background:var(--card2);border-radius:9px;padding:6px 8px;font-size:12px}
.mini:disabled{opacity:.4}
.mini.on{background:var(--gold);color:#241a00;font-weight:700}
.row2{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:8px 10px;margin-bottom:6px;flex-wrap:wrap}
.row2 .nm{flex:1;min-width:90px;font-size:13px}
.row2 .nm small{display:block;color:var(--muted);font-size:11px}
.row2 .btns{display:flex;gap:5px;flex-wrap:wrap}
.up{color:var(--good)}.dn{color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:#0f1116;border-top:1px solid #222735;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav #nav{max-width:520px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none}
nav #nav::-webkit-scrollbar{display:none}
nav button{background:none;flex:1 0 64px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;opacity:.55}
nav button span{font-size:21px}
nav button small{font-size:10px;white-space:nowrap}
nav button.on{opacity:1;color:var(--gold)}
#over,#modal{position:fixed;inset:0;background:rgba(5,6,9,.84);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
#over.show,#modal.show{display:flex}
.sheet{background:var(--card);border-radius:20px;padding:16px;width:100%;max-width:440px;max-height:90dvh;overflow-y:auto}
.sheet h2{margin:0 0 8px;font-size:19px}
.sheet p{margin:6px 0;line-height:1.4;font-size:14px;color:#c9cedb}
.sheet ul{margin:6px 0;padding-left:18px;font-size:13.5px;line-height:1.5;color:#c9cedb}
.btn{display:block;width:100%;padding:13px;border-radius:14px;background:var(--gold);color:#241a00;font-weight:800;font-size:15px;margin-top:10px}
.btn.alt{background:var(--card2);color:var(--text)}
.item{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:12px;padding:8px 10px;margin-top:6px}
.item .ic{font-size:22px}.item .tx{flex:1;font-size:13px}.item .tx small{display:block;color:var(--muted);font-size:11px}
.item button{background:var(--gold);color:#241a00;font-weight:700;border-radius:10px;padding:8px 10px;font-size:12.5px;white-space:nowrap}
.item button:disabled{background:#3a4152;color:#8a92a6}
.reign{background:var(--card);border-radius:18px;padding:14px;text-align:center;margin-bottom:8px}
.reign .who{font-size:44px}
.reign .tx{font-size:15px;line-height:1.35;margin:8px 0 4px}
.cas{background:#12261d;border:1px solid #1f4d36;border-radius:14px;padding:10px;margin-bottom:8px;text-align:center}
.cas .res{font-size:26px;margin:6px 0;min-height:34px}
.cas .sub{font-size:12px;color:#9fd8b8;min-height:16px}
input[type=number]{width:64px;background:var(--card2);border:0;color:var(--text);border-radius:8px;padding:6px 8px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:88vw;text-align:center}
#toast.show{opacity:1}

</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="stagechip" id="stage"></div>
    <div class="chip" id="clock"></div>
    <button class="money" id="wallet"></button>
  </div>
  <div class="stats" id="stats"></div>
  <div id="goal"></div>
  <div class="log" id="log"></div>
  <div id="view"></div>
</div>
<nav><div id="nav"></div></nav>
<div id="over"></div>
<div id="modal"><div class="sheet" id="modalBody"></div></div>
<div id="toast"></div>
<script>
/* --- 01_core.js --- */
/* ===================== CORE ===================== */
const tg = window.Telegram && window.Telegram.WebApp;
const T = f => { try { f(); } catch (e) {} };
if (tg) {
  T(() => tg.ready()); T(() => tg.expand());
  T(() => tg.setHeaderColor('#14161c')); T(() => tg.setBackgroundColor('#14161c'));
  T(() => tg.disableVerticalSwipes());
}
const hap = (t = 'light') => T(() => tg.HapticFeedback.impactOccurred(t));
const note = t => T(() => tg.HapticFeedback.notificationOccurred(t));

// Адрес воркера рейтинга (см. server/README.md). Пусто = рейтинг только локальный.
const API_URL = '';
// Ссылка на мини-апп для кнопки "Поделиться" (например https://t.me/your_bot/app)
const SHARE_URL = '';
const KEY = 'bomzhara_v2', META_KEY = 'bomzhara_meta_v2';

const $ = s => document.querySelector(s);
const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const rf = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
const pad = n => String(n).padStart(2, '0');
function gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const SYM = { RUB: '₽', USD: '$', EUR: '€', CNY: '¥' };
function fmt(n) {
  const a = Math.abs(n), s = n < 0 ? '-' : '';
  const t = (x, d) => String(+x.toFixed(d)).replace('.', ',');
  if (a < 1e5) return s + Math.round(a).toLocaleString('ru-RU').replace(/[  ]/g, ' ');
  if (a < 1e6) return s + t(a / 1e3, 0) + ' тыс';
  if (a < 1e9) return s + t(a / 1e6, a < 1e7 ? 2 : 1) + ' млн';
  if (a < 1e12) return s + t(a / 1e9, 2) + ' млрд';
  return s + t(a / 1e12, 2) + ' трлн';
}
const mny = (n, c = 'RUB') => fmt(n) + ' ' + SYM[c];

/* ---------- глобальные реестры ---------- */
let S, CUR = [];
const M = { fn: null };       // модальное окно: функция, возвращающая HTML
const DAILY = [];             // ежедневные хуки
const TABS = {};              // вкладки
const GOALS = {};             // цели этапов
const TAB_ORDER = ['yard', 'market', 'station', 'scrap', 'shelter', 'home', 'work', 'study', 'biz', 'invest', 'empire', 'politics', 'state', 'bank', 'casino', 'garage', 'rating'];

/* ---------- состояние ---------- */
function fresh() {
  const stk = {}; STOCKS.forEach(s => stk[s.id] = { p: s.p, q: 0, h: [s.p] });
  return {
    v: 2, stage: 1, day: 1, hour: 8, intro: false, over: null,
    cash: { RUB: 40, USD: 0, EUR: 0, CNY: 0 }, debt: 0, deposit: 0,
    hp: 100, food: 70, energy: 85, warm: 85, mood: 70,
    loc: 'yard', tab: 'yard',
    bottles: 0, metal: 0, jacket: false, bag: false, cart: false, shelterFull: 0, soupDay: 0, pass: 0, passDay: 0,
    housing: 0, arrears: 0, transport: 0,
    edu: { school: 0, uni: 0, exams: 0, visa: 0, visaDay: 0 }, major: null, mba: false,
    job: false, jobLvl: 0, jobXp: 0,
    team: 0, perf: 50, lowPerf: 0,
    biz: { units: [], brand: 0, sup: 1, mgr: false, neglect: 0, crisis: 0, month: 0 },
    stk, estate: { n: 0, price: 25e6 }, corps: [], scandal: 0, rep: 50,
    pol: { lvl: 0, appr: 50, next: 0, camp: 0 },
    st: { treasure: 50, people: 50, army: 50, science: 50, space: 0, card: null },
    fx: { r: { USD: 95, EUR: 103, CNY: 13.2 }, b: { USD: 95, EUR: 103, CNY: 13.2 }, h: { USD: [95], EUR: [103], CNY: [13.2] }, d: { USD: 0, EUR: 0, CNY: 0 } },
    azart: 0, chip: 0, game: 'slots', cas: { last: '', sub: '', bj: null, num: 17 },
    did: {}, stats: { casinoNet: 0, hosp: 0, falls: 0 }, stageDay: { 1: 1 },
    log: []
  };
}
function save() {
  const j = JSON.stringify(S);
  T(() => localStorage.setItem(KEY, j));
  T(() => tg.CloudStorage.setItem(KEY, j.length < 4000 ? j : '{}'));
}
function loadSave(cb) {
  let j = null;
  T(() => { j = localStorage.getItem(KEY); });
  if (j) { try { cb(JSON.parse(j)); return; } catch (e) {} }
  cb(null);
}
let META = { best: null, runs: 0, wins: 0 };
function loadMeta() { T(() => { const j = localStorage.getItem(META_KEY); if (j) META = Object.assign(META, JSON.parse(j)); }); }
function saveMeta() { T(() => localStorage.setItem(META_KEY, JSON.stringify(META))); }

/* ---------- деньги ---------- */
const rub = () => S.cash.RUB;
const earn = (n, c = 'RUB') => { S.cash[c] += n; };
function pay(n, c = 'RUB') { if (S.cash[c] + 1e-9 < n) return false; S.cash[c] -= n; return true; }
const toRub = (n, c) => c === 'RUB' ? n : n * S.fx.r[c];
function assetsRub() {
  let n = S.cash.RUB;
  for (const c of ['USD', 'EUR', 'CNY']) n += S.cash[c] * S.fx.r[c];
  n += S.deposit;
  for (const k in S.stk) n += S.stk[k].p * S.stk[k].q;
  n += S.estate.n * S.estate.price;
  const H = HOUSING[S.housing]; if (H.own) n += H.price;
  const t = TRANS[S.transport]; if (t.price) n += toRub(t.price, t.cur || 'RUB') * 0.5;
  for (const l of S.biz.units) n += BIZ[l].cost * 0.8;
  for (const id of S.corps) n += CORPS.find(c => c.id === id).price * 0.9;
  return n;
}
const netWorth = () => assetsRub() - S.debt;
function calcScore() { return Math.max(0, Math.round(S.stage * 10000 + 1500 * Math.log10(1 + Math.max(0, netWorth())) - S.day)); }

/* ---------- мелочи ---------- */
function say(t, cls = '') { S.log.push({ t, cls }); if (S.log.length > 30) S.log.shift(); }
function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 1700); }
const eat = n => { S.food = clamp(S.food + n); };
const hurt = n => { S.hp = clamp(S.hp - n); };
const heal = n => { S.hp = clamp(S.hp + n); };
const moodUp = n => { S.mood = clamp(S.mood + n); };
const enUp = n => { S.energy = clamp(S.energy + n); };
const inH = (a, b) => S.hour >= a && S.hour < b;
const isNightH = h => h >= 21 || h < 6;
const isNight = () => isNightH(S.hour);
function temp(day, hour) {
  const base = 9 - day * 0.8 + Math.sin(day * 1.7) * 3;
  const dip = hour < 5 ? 2 : 0;
  return Math.round(base - (isNightH(hour) ? 4 : 0) - dip + (hour >= 12 && hour <= 16 ? 2 : 0));
}

/* ---------- кнопки-замыкания ---------- */
function B(ic, t, s, run, ok = true, why = '', cls = '') {
  const i = CUR.push(run) - 1;
  return '<button class="act ' + cls + '" data-i="' + i + '"' + (ok ? '' : ' disabled') + '><span class="ic">' + ic + '</span><b>' + t + '</b><small>' + (ok ? (s || '') : (why || '')) + '</small></button>';
}
function mini(t, run, ok = true, cls = '') {
  const i = CUR.push(run) - 1;
  return '<button class="mini ' + cls + '" data-i="' + i + '"' + (ok ? '' : ' disabled') + '>' + t + '</button>';
}
const grid = a => '<div class="acts">' + a.join('') + '</div>';
const sec = t => '<div class="sec">' + t + '</div>';
const box = h => '<div class="box">' + h + '</div>';
function sheet(h) { return '<h2>' + h.t + '</h2>' + (h.html || '') + mini('Закрыть', () => { M.fn = null; }, true, 'closebtn'); }
function closeBtn() { return '<div style="margin-top:10px">' + mini('Закрыть', () => { M.fn = null; }) + '</div>'; }

/* ---------- время и характеристики ---------- */
const HSTEP = 0.5;
function stepStats(mode) {
  const k = HSTEP;
  if (S.stage >= 10) return;
  const sleeping = mode === 'sleepOut' || mode === 'sleepIn' || mode === 'sleepHome';
  const housed = S.housing > 0;
  const indoor = housed || mode === 'in' || mode === 'sleepIn';
  const q = housed ? HOUSING[S.housing].q : 1;
  S.food = clamp(S.food - (sleeping ? 1.5 : 2.5) * k);
  S.energy = clamp(S.energy + (sleeping ? (indoor ? 11 * q : 8) : -3) * k);
  if (S.stage >= 2) S.mood = clamp(S.mood + (sleeping ? 1.5 * q : -0.7) * k);
  if (housed) S.warm = 100;
  else {
    const t = temp(S.day, S.hour);
    const cf = clamp((10 - t) / 10, 0, 2.6);
    let loss = 1.7 * cf;
    if (S.jacket) loss *= 0.65;
    if (sleeping && S.bag) loss *= 0.5;
    if (indoor) S.warm = clamp(S.warm + (sleeping ? 3 : 8) * k);
    else S.warm = clamp(S.warm - loss * k);
  }
  if (S.food <= 0) S.hp -= 4 * k;
  if (S.warm <= 0) S.hp -= 5 * k;
  if (S.energy <= 0) S.hp -= 2 * k;
  if (S.stage >= 2 && S.mood <= 0) S.hp -= 1.5 * k;
  const ok = S.food > 40 && S.warm > 40 && S.energy > 25 && (S.stage < 2 || S.mood > 25);
  if (ok) S.hp += (sleeping ? 2 : 0.7) * k;
  S.hp = clamp(S.hp);
}
function tick(h, mode = 'out') {
  const steps = Math.max(1, Math.round(h / HSTEP));
  for (let i = 0; i < steps; i++) {
    S.hour += HSTEP;
    if (S.hour >= 24) { S.hour -= 24; newDay(); }
    stepStats(mode);
    if (S.hp <= 0) { if (!collapse()) return false; }
  }
  return true;
}
function newDay() {
  S.day++; S.did = {};
  for (const f of DAILY) { try { f(); } catch (e) { console.error(e); } }
}
function collapse() {
  if (S.stage === 1) { die(); return false; }
  const fee = Math.round(S.cash.RUB * 0.1); S.cash.RUB -= fee;
  S.hp = 60; S.food = 60; S.energy = 60; S.mood = Math.max(S.mood, 40);
  S.stats.hosp++;
  say('🏥 Организм сдался. Неделя в больнице, счёт: ' + mny(fee) + '.', 'bad');
  for (let i = 0; i < 7; i++) newDay();
  return true;
}
function die() {
  if (S.over) return;
  S.hp = 0;
  const why = S.food <= 0 ? 'умер от голода' : S.warm <= 0 ? 'замёрз насмерть' : S.energy <= 0 ? 'упал без сил и не встал' : 'не пережил уличные разборки';
  S.over = { type: 'dead', why };
  note('error'); finishRun();
}
function finishRun() {
  META.runs++;
  const sc = calcScore();
  if (!META.best || sc > META.best.score) META.best = { score: sc, stage: S.stage, day: S.day };
  if (S.over && S.over.type === 'win') META.wins++;
  saveMeta(); submitScore(true);
}

/* ---------- пауза и пропуск дней ---------- */
function autoEat() {
  const opts = FOODS.filter(f => f.min <= S.stage).reverse();
  const cap = Math.max(120, rub() * 0.01);
  let f = opts.find(x => x.p <= cap && x.p <= rub());
  if (!f) f = FOODS.find(x => x.p <= rub());
  if (f) { S.cash.RUB -= f.p; eat(f.f); moodUp(f.m || 0); heal(f.h || 0); }
}
function waitDays(n) {
  for (let i = 0; i < n; i++) {
    if (S.over || S.stage === 1) break;
    autoEat(); if (!tick(8, 'sleepHome')) break;
    autoEat(); if (!tick(8, 'home')) break;
    autoEat(); if (!tick(8, 'home')) break;
  }
}

/* ---------- смена этапов ---------- */
function tabsNow() { return TAB_ORDER.filter(id => TABS[id] && S.stage >= TABS[id].from && S.stage <= TABS[id].to); }
function setStage(n, kind, reason) {
  const up = n > S.stage;
  S.stage = n;
  if (!S.stageDay[n]) S.stageDay[n] = S.day;
  const START = { 2: 'work', 3: 'study', 4: 'work', 5: 'work', 6: 'biz', 7: 'invest', 8: 'empire', 9: 'politics', 10: 'state' };
  S.tab = (up && START[n] && tabsNow().includes(START[n])) ? START[n] : tabsNow()[0];
  S.did = {};
  if (up) { M.fn = () => stageModal(n); note('success'); }
  else { S.stats.falls++; M.fn = () => fallModal(n, reason); note('error'); }
  save(); submitScore();
}
function stageModal(n) {
  const st = STAGES[n];
  return '<h2>' + st.ic + ' ' + st.n + '</h2><p>' + st.tag + '</p><ul>' + st.feat.map(f => '<li>' + f + '</li>').join('') + '</ul>' + '<button class="btn" id="mclose" data-close="1">Поехали</button>';
}
function fallModal(n, reason) {
  const st = STAGES[n];
  return '<h2>📉 Откат: ' + st.ic + ' ' + st.n + '</h2><p>' + reason + '</p><p>Падение не конец. Поднимайся снова.</p><button class="btn" data-close="1">Понял</button>';
}
function fall(n, reason) { say('📉 ' + reason, 'bad'); setStage(n, 'down', reason); }

/* --- 02_data.js --- */
/* ===================== ДАННЫЕ ===================== */
const STAGES = {

const cap = () => S.cart ? 45 : 15;
const load = () => S.bottles + S.metal * 3;
const freeLoad = () => cap() - load();

function findBottles(lo, hi) {
  const n = rand(lo, hi), got = Math.min(n, Math.max(0, freeLoad()));
  S.bottles += got;
  say(got ? 'Нашёл бутылок: ' + got + (got < n ? ' (остальные не влезли).' : '.') : 'Бутылки есть, а класть некуда.', got ? 'good' : '');
}
function police() {
  if (S.cash.RUB >= 30 && Math.random() < 0.6) {
    const fine = Math.min(S.cash.RUB, rand(30, 90)); S.cash.RUB -= fine;
    say('Патруль: «Документы!» Откупился на ' + fine + ' ₽.', 'bad');
  } else { enUp(-12); say('Патруль погнал взашей. Еле убежал.', 'bad'); }
  note('warning');
}
const EV1 = [
  { w: 3, loc: '*', run: () => { const n = rand(10, 60); earn(n); say('Нашёл в траве мятую купюру: ' + n + ' ₽.', 'good'); } },

function maybeEvent(p) {
  if (S.hp <= 0 || Math.random() >= p) return;
  const pool = EV1.filter(e => (e.loc === '*' || e.loc.includes(S.loc)) && (!e.cond || e.cond()));
  const sum = pool.reduce((a, e) => a + e.w, 0);
  let r = Math.random() * sum;
  for (const e of pool) { r -= e.w; if (r <= 0) { e.run(); return; } }
}
function beg(lo, hi, pp) {
  if (!tick(1, 'out')) return;
  const n = rand(lo, hi);
  if (n > 0) { earn(n); say('Подали ' + n + ' ₽.', 'good'); } else say('Все спешат мимо. Ни копейки.');
  if (Math.random() < pp) police(); else maybeEvent(0.2);
}
function dumpster() {
  if (!tick(1, 'out')) return;
  const r = Math.random();
  if (r < 0.4) {
    const f = rand(8, 18); eat(f);
    if (Math.random() < 0.25) { hurt(8); say('Объедки (+' + f + ' сытости) были с душком. Живот болит.', 'bad'); }
    else say('Нашёл вполне съедобные объедки (+' + f + ' сытости).', 'good');
  } else if (r < 0.65) { const m = rand(3, 25); earn(m); say('В мусорке нашлась мелочь: ' + m + ' ₽.', 'good'); }
  else if (r < 0.8) findBottles(1, 3);
  else say('Пусто. Только запах.');
  maybeEvent(0.15);
}
function sleepStreet(mode, theftP, place, patrol) {
  if (!tick(8, mode)) return;
  say('Поспал (' + place + ').', 'good');
  if (Math.random() < theftP && S.cash.RUB >= 20) {
    const l = Math.round(S.cash.RUB * rand(15, 35) / 100);
    S.cash.RUB -= l; say('Пока спал, обшарили карманы: -' + l + ' ₽.', 'bad'); note('error');
  } else if (patrol && Math.random() < 0.2) {
    enUp(-15); S.warm = clamp(S.warm - 6); say('Патруль выгнал из зала посреди ночи.', 'bad');
  }
  maybeEvent(0.15);
}
function waitStreet() { if (!tick(1, 'out')) return; say('Постоял, подумал о вечном.'); maybeEvent(0.25); }

function streetActs(loc) {
  const A = [], h = S.hour;
  if (loc === 'yard') {
    A.push(B('🍾', 'Искать бутылки', '2 ч', () => { if (!tick(2, 'out')) return; findBottles(3, 8); maybeEvent(0.25); }, freeLoad() > 0, 'Некуда класть тару'));

/* ---------- ежедневные расходы ---------- */
function payBill(n, why) {
  if (n <= 0) return true;
  if (S.cash.RUB >= n) { S.cash.RUB -= n; S.arrears = 0; return true; }
  const lack = n - S.cash.RUB; S.cash.RUB = 0; S.debt += lack; S.arrears++;
  say('Не хватило денег (' + why + '). Долг растёт.', 'bad');
  if (S.arrears >= 3) evict();
  return false;
}
function evict() {
  S.arrears = 0;
  if (S.stage <= 3) {
    S.housing = 0; S.debt = 0; S.transport = 0; S.job = false; S.cash.RUB = 0;
    fall(1, 'Не хватило на жильё три дня подряд. Тебя выселили.');
  } else if (S.stage <= 5) {
    if (S.housing > 1 && !HOUSING[S.housing].own) { S.housing = 1; say('Съёмную квартиру пришлось сдать. Вернулся в общагу.', 'bad'); }
    else if (S.stage >= 4) { S.job = false; S.debt = Math.max(0, S.debt - 50000); fall(2, 'Долги задавили: потерял работу и откатился на ступень трудяги.'); }
  }
}
DAILY.push(() => {
  if (S.stage === 1 || S.stage >= 10) return;
  if (S.stage === 3) earn(100);
  payBill(HOUSING[S.housing].up + (TRANS[S.transport].up || 0), 'жильё и транспорт');
  S.azart = Math.max(0, S.azart - 12);
});

function sleepHome(h) {
  if (!tick(h, 'sleepHome')) return;

function eatTier(f) {
  if (!pay(f.p)) return toast('Не хватает денег');
  if (!tick(0.5, 'home')) return;
  eat(f.f); moodUp(f.m || 0); heal(f.h || 0); enUp(f.e || 0);
  say(f.ic + ' ' + f.n + ' за ' + mny(f.p) + '.');
}
function doLeisure(l) {
  if (!pay(l.cost)) return toast('Не хватает денег');
  if (l.days) { waitDays(l.days); } else if (!tick(l.h, 'home')) return;
  moodUp(l.mood); heal(l.hp || 0); enUp(l.en || 0);
  if (l.hp && l.hp < 0) hurt(-l.hp);
  say(l.ic + ' ' + l.n + (l.cost ? ' (' + mny(l.cost) + ')' : '') + '. Настроение +' + l.mood + '.', 'good');
}
function moveTo(i) {
  const H = HOUSING[i], cur = HOUSING[S.housing];
  const cost = H.own ? H.price : (H.fee || 0), refund = cur.own ? cur.price * 0.9 : 0;
  if (rub() + refund < cost) return toast('Не хватает денег');
  S.cash.RUB += refund - cost; S.housing = i; S.arrears = 0;
  say(H.ic + ' Переехал: ' + H.n + '.', 'good'); note('success'); M.fn = null;
}

/* ============ БАНК, ОБМЕННИК, БИРЖА, НЕДВИЖИМОСТЬ ============ */
function spark(arr, w = 84, h = 24) {
  if (!arr || arr.length < 2) return '<span class="muted">...</span>';
  const mn = Math.min(...arr), mx = Math.max(...arr), up = arr[arr.length - 1] >= arr[0];
  const pts = arr.map((v, i) => (i / (arr.length - 1) * w).toFixed(1) + ',' + (h - 2 - ((v - mn) / (mx - mn || 1)) * (h - 4)).toFixed(1)).join(' ');
  return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '"><polyline fill="none" stroke="' + (up ? '#4ade80' : '#f87171') + '" stroke-width="2" points="' + pts + '"/></svg>';
}
const pctTxt = d => '<span class="' + (d >= 0 ? 'up' : 'dn') + '">' + (d >= 0 ? '+' : '') + (d * 100).toFixed(1) + '%</span>';

/* ---------- ежедневные хуки ---------- */
DAILY.push(() => {
  const f = S.fx, g = gauss() * 0.008;
  const shock = Math.random() < 0.04, sgn = Math.random() < 0.55 ? 1 : -1;
  for (const c of ['USD', 'EUR', 'CNY']) {
    f.b[c] *= 1.0004;
    const prev = f.r[c];
    let ret = (f.b[c] - prev) / f.b[c] * 0.05 + g + gauss() * 0.006;
    if (shock) ret += sgn * rf(0.05, 0.12) * (c === 'CNY' ? 0.7 : 1);
    f.r[c] = Math.max(f.b[c] * 0.55, prev * (1 + ret));
    f.d[c] = f.r[c] / prev - 1;
    f.h[c].push(f.r[c]); if (f.h[c].length > 40) f.h[c].shift();
  }
  if (shock && S.stage >= 4) say(sgn > 0 ? '💱 Рубль обвалился: валюта резко дорожает!' : '💱 Рубль укрепился: валюта дешевеет.', sgn > 0 ? 'bad' : 'good');
});
DAILY.push(() => {
  if (S.deposit > 0) S.deposit *= 1 + 0.16 / 365;
  if (S.debt > 0) {
    if (S.stage < 4) { const r = Math.min(S.debt, S.cash.RUB); S.cash.RUB -= r; S.debt -= r; }
    else S.debt *= 1 + 0.2 / 365;
  }
});
DAILY.push(() => {
  const mkt = gauss() * 0.008 + (S.mkt || 0); S.mkt = (S.mkt || 0) * 0.75;
  let hit = null;
  if (Math.random() < 0.07) {
    const big = Math.random() < 0.3, sgn = Math.random() < 0.5 ? 1 : -1;
    if (big) { S.mkt = (S.mkt || 0) + sgn * rf(0.015, 0.035); if (S.stage >= 7) say(sgn > 0 ? '📰 Рынок взлетел на хороших новостях.' : '📰 Рынок падает: паника на бирже.', sgn > 0 ? 'good' : 'bad'); }
    else { hit = { s: STOCKS[rand(0, STOCKS.length - 1)], d: sgn * rf(0.08, 0.2) }; }
  }
  for (const s of STOCKS) {
    const o = S.stk[s.id];
    let ret = s.drift + mkt * (s.vol / 0.02) + gauss() * s.vol;
    if (hit && hit.s.id === s.id) { ret += hit.d; if (S.stage >= 7) say('📰 ' + s.n + (hit.d > 0 ? ' выросла на новостях.' : ' упала из-за скандала.'), hit.d > 0 ? 'good' : 'bad'); }
    o.p = Math.max(1, o.p * (1 + ret));
    o.h.push(o.p); if (o.h.length > 30) o.h.shift();
  }
  // недвижимость
  const e = S.estate; e.price = Math.max(5e6, e.price * (1 + 0.0003 + gauss() * 0.004));
  if (e.n > 0) earn(e.n * e.price * 0.0035);
});

const cardName = r => ({ 1: 'A', 11: 'J', 12: 'Q', 13: 'K' }[r] || r);
const cardVal = r => r > 10 ? 10 : r;
function handVal(h) { let t = h.reduce((a, c) => a + cardVal(c.r), 0); if (h.some(c => c.r === 1) && t + 10 <= 21) t += 10; return t; }
const showHand = (h, hide) => h.map((c, i) => hide && i === 1 ? '🂠' : cardName(c.r) + c.s).join(' ');
const drawCard = () => ({ r: rand(1, 13), s: SU[rand(0, 3)] });

const chipVals = () => [1, 5, 25, 100].map(m => CAS_BASE[S.stage] * m);
const curBet = () => chipVals()[Math.min(S.chip, 3)];
const locked = () => S.azart >= 100;

function settle(bet, ret, text, sub) {
  // bet уже списана; ret = сколько вернулось
  S.cash.RUB += ret; S.stats.casinoNet += ret - bet;
  S.cas.last = text; S.cas.sub = sub || (ret > bet ? '+' + mny(ret - bet) : ret === bet ? 'Ставка возвращена' : '-' + mny(bet - ret));
  if (ret > bet) note('success');
  S.azart = Math.min(100, S.azart + 3);
  if (S.azart >= 70) moodUp(-2);
  if (S.azart >= 100) { moodUp(-15); say('🎰 Азарт зашкаливает. Нужно остановиться, ставки заблокированы до завтра.', 'bad'); }
}
function startRound() {
  const bet = curBet();
  if (locked()) { toast('Слишком сильный азарт. Приходи завтра.'); return null; }
  if (rub() < bet) { toast('Не хватает денег на ставку'); return null; }
  if (!tick(0.5, 'home')) return null;
  S.cash.RUB -= bet; return bet;
}
function playCoin(side) {
  const bet = startRound(); if (!bet) return;
  const r = Math.random() < 0.5 ? 'орёл' : 'решка';
  settle(bet, r === side ? bet * 1.9 : 0, r === 'орёл' ? '🦅' : '🪙', 'Выпал ' + r);
}
function playSlots() {
  const bet = startRound(); if (!bet) return;
  const tot = SLOT.reduce((a, x) => a + x.w, 0), pick = () => { let r = Math.random() * tot; for (const x of SLOT) { r -= x.w; if (r <= 0) return x; } return SLOT[0]; };
  const r = [pick(), pick(), pick()]; let mult = 0;
  if (r[0].s === r[1].s && r[1].s === r[2].s) mult = r[0].p;
  else if (r.filter(x => x.s === '🍒').length === 2) mult = 0.2;
  settle(bet, bet * mult, r.map(x => x.s).join(' '), mult >= 1 ? 'Выигрыш ×' + mult + '!' : mult > 0 ? 'Две вишни: возврат 20%' : '');
}
function playDice(kind) {
  const bet = startRound(); if (!bet) return;
  const a = rand(1, 6), b = rand(1, 6), s = a + b; let mult = 0;
  if (kind === 'over' && s > 7) mult = 2.2; if (kind === 'under' && s < 7) mult = 2.2; if (kind === 'seven' && s === 7) mult = 5.5;
  settle(bet, bet * mult, '🎲 ' + a + ' + ' + b + ' = ' + s, '');
}
function playRoulette(kind, num) {
  const bet = startRound(); if (!bet) return;
  const n = rand(0, 36), red = RED.includes(n); let mult = 0;
  if (kind === 'red' && red) mult = 2; if (kind === 'black' && n > 0 && !red) mult = 2;
  if (kind === 'even' && n > 0 && n % 2 === 0) mult = 2; if (kind === 'odd' && n % 2 === 1) mult = 2;
  if (kind === 'num' && n === num) mult = 36;
  settle(bet, bet * mult, '🎡 ' + n + (n === 0 ? ' зеро' : red ? ' красное' : ' чёрное'), '');
}
/* блэкджек */
function bjDeal() {
  const bet = startRound(); if (!bet) return;
  const bj = { bet, p: [drawCard(), drawCard()], d: [drawCard(), drawCard()], done: false, doubled: false };
  S.cas.bj = bj;
  if (handVal(bj.p) === 21) bjFinish();
}
function bjFinish() {
  const bj = S.cas.bj; bj.done = true;
  const pv = handVal(bj.p);
  while (handVal(bj.d) < 17 && pv <= 21) bj.d.push(drawCard());
  const dv = handVal(bj.d), stake = bj.bet * (bj.doubled ? 2 : 1);
  const pBJ = bj.p.length === 2 && pv === 21, dBJ = bj.d.length === 2 && dv === 21;
  let ret = 0, sub;
  if (pv > 21) { ret = 0; sub = 'Перебор'; }
  else if (pBJ && !dBJ) { ret = bj.bet * 2.5; sub = 'Блэкджек 3:2!'; }
  else if (dv > 21 || pv > dv) { ret = stake * 2; sub = 'Победа'; }
  else if (pv === dv) { ret = stake; sub = 'Ничья'; }
  else { ret = 0; sub = 'Дилер выиграл'; }
  bj.text = 'Ты: ' + showHand(bj.p) + ' (' + pv + ')<br>Дилер: ' + showHand(bj.d) + ' (' + dv + ')';
  settle(stake, ret, '🃏', sub);
}
function bjHit() { const bj = S.cas.bj; bj.p.push(drawCard()); if (handVal(bj.p) >= 21) bjFinish(); }
function bjDouble() { const bj = S.cas.bj; if (!pay2(bj.bet)) return; bj.doubled = true; bj.p.push(drawCard()); bjFinish(); }

const GAMES = [['slots', '🎰', 'Слоты'], ['roulette', '🎡', 'Рулетка'], ['bj', '🃏', 'Блэкджек'], ['dice', '🎲', 'Кости'], ['coin', '🪙', 'Монетка']];
function casinoView() {
  const bet = curBet();
  let h = box('<b>🎰 ' + CAS_NAME(S.stage) + '</b><div class="muted">Шанс всегда чуть против тебя. Азарт: <b class="' + (S.azart >= 70 ? 'dn' : '') + '">' + Math.round(S.azart) + '/100</b> · итог за всё время: <span class="' + (S.stats.casinoNet >= 0 ? 'up' : 'dn') + '">' + mny(S.stats.casinoNet) + '</span></div>');
  h += '<div class="chips">' + GAMES.map(g => mini(g[1] + ' ' + g[2], () => { S.game = g[0]; }, true, S.game === g[0] ? 'on' : '')).join('') + '</div>';
  h += '<div class="chips"><span class="muted" style="align-self:center">Ставка:</span>' + chipVals().map((v, i) => mini(fmt(v), () => { S.chip = i; }, true, S.chip === i ? 'on' : '')).join('') + '</div>';
  const bj = S.cas.bj;
  let body = '<div class="res">' + (S.cas.last || '🎲') + '</div><div class="sub">' + (S.cas.sub || '') + '</div>';
  if (S.game === 'bj' && bj) body += '<div style="margin-top:6px;font-size:14px">' + (bj.done ? bj.text : 'Ты: ' + showHand(bj.p) + ' (' + handVal(bj.p) + ')<br>Дилер: ' + showHand(bj.d, true)) + '</div>';
  h += '<div class="cas">' + body + '</div>';
  const lk = locked(), can = rub() >= bet && !lk, why = lk ? 'Азарт зашкаливает' : 'Нужно ' + mny(bet);
  const A = [];
  if (S.game === 'slots') A.push(B('🎰', 'Крутить', 'ставка ' + mny(bet), playSlots, can, why, 'big'));
  if (S.game === 'coin') { A.push(B('🦅', 'Орёл', '×1,9', () => playCoin('орёл'), can, why)); A.push(B('🪙', 'Решка', '×1,9', () => playCoin('решка'), can, why)); }
  if (S.game === 'dice') { A.push(B('⬆️', 'Больше 7', '×2,2', () => playDice('over'), can, why)); A.push(B('⬇️', 'Меньше 7', '×2,2', () => playDice('under'), can, why)); A.push(B('7️⃣', 'Ровно 7', '×5,5', () => playDice('seven'), can, why, 'big')); }
  if (S.game === 'roulette') {
    A.push(B('🔴', 'Красное', '×2', () => playRoulette('red'), can, why)); A.push(B('⚫', 'Чёрное', '×2', () => playRoulette('black'), can, why));
    A.push(B('2️⃣', 'Чётное', '×2', () => playRoulette('even'), can, why)); A.push(B('1️⃣', 'Нечётное', '×2', () => playRoulette('odd'), can, why));
    A.push(B('🎯', 'Число ' + (S.cas.num || 17), '×36', () => playRoulette('num', S.cas.num || 17), can, why, 'big'));
  }
  if (S.game === 'bj') {
    if (!bj || bj.done) A.push(B('🃏', 'Раздать карты', 'ставка ' + mny(bet), bjDeal, can, why, 'big'));
    else {
      A.push(B('➕', 'Ещё', '', bjHit)); A.push(B('✋', 'Хватит', '', bjFinish));
      A.push(B('✖️2', 'Удвоить', mny(bj.bet), bjDouble, bj.p.length === 2 && rub() >= bj.bet, 'Нет денег', 'big'));
    }
  }
  h += grid(A);
  if (S.game === 'roulette') h += '<div class="chips"><span class="muted" style="align-self:center">Своё число (0-36):</span><input id="rnum" type="number" min="0" max="36" value="' + (S.cas.num || 17) + '"></div>';
  return h;
}
document.addEventListener('input', e => { if (e.target && e.target.id === 'rnum') S.cas.num = clamp(parseInt(e.target.value) || 0, 0, 36); });
TABS.casino = { ic: '🎰', n: 'Казино', from: 2, to: 10, view: casinoView };

/* ============ ЭТАПЫ 6-8: БИЗНЕС, ИНВЕСТОР, МАГНАТ ============ */
function bizTotal() { return S.biz.units.reduce((a, l) => a + BIZ[l].cost, 0); }
function bizMult() {
  const b = S.biz, sat = 1 / (1 + bizTotal() / 3e9);
  return SUPS[b.sup].m * (1 + b.brand / 200) * sat * (b.crisis > 0 ? 0.6 : 1) * (b.mgr ? 1 : Math.max(0.4, 1 - 0.1 * b.neglect));
}
const bizGross = () => bizTotal() * 0.08 * bizMult();
const bizNet = () => bizGross() * (b => b.mgr ? 0.7 : 0.85)(S.biz);

DAILY.push(() => {
  const b = S.biz; if (S.stage < 6 || !b.units.length) return;
  let profit = bizGross();
  if (b.sup === 0 && Math.random() < 0.1) { profit *= 0.7; say('Дешёвое сырьё испортилось: прибыль упала.', 'bad'); }
  const net = profit * (b.mgr ? 0.7 : 0.85);
  earn(net); b.month += net;
  b.brand = clamp(b.brand - 1 + (b.sup === 2 ? 0.5 : 0)); b.neglect++; if (b.crisis > 0) b.crisis--;
  if (S.day % 30 === 0) {
    const tax = b.month * 0.13; b.month = 0;
    if (!payBill(tax, 'налоги')) { /* долг записан */ }
    say('🧾 Налоги за месяц: ' + mny(tax) + '.');
  }
  const r = Math.random();
  if (r < 0.03) { const f = Math.min(rub(), net * 3); S.cash.RUB -= f; say('🔍 Налоговая проверка: штраф ' + mny(f) + '.', 'bad'); }
  else if (r < 0.06) { b.crisis = 5; say('📉 Кризис поставок: прибыль -40% на 5 дней.', 'bad'); }
  else if (r < 0.09) { b.brand = clamp(b.brand + 20); say('📱 Вирусный пост: бренд вырос!', 'good'); }
});
// банкротство
DAILY.push(() => {
  if (S.stage < 6 || S.stage >= 10) return;
  if (S.debt > 1e6 && S.debt > 0.7 * assetsRub()) {
    S.biz = { units: [], brand: 0, sup: 1, mgr: false, neglect: 0, crisis: 0, month: 0 };
    S.cash = { RUB: 0, USD: 0, EUR: 0, CNY: 0 }; S.deposit = 0; S.debt = 0; S.corps = []; S.estate.n = 0;
    for (const k in S.stk) S.stk[k].q = 0;
    S.housing = 1; S.transport = Math.min(S.transport, 3); S.job = true; S.jobLvl = 1; S.jobXp = Math.max(S.jobXp, CAREER_XP[1]);
    fall(4, 'Банкротство! Кредиторы забрали бизнес и активы. Ты снова специалист.');
  }
});

  h += grid([B('⏩', 'Ждать неделю', '7 дней', () => waitDays(7), true, '', 'big')]);
  return h;
}

/* ============ ЭТАПЫ 9-10: ПОЛИТИКА И ГОСУДАРСТВО ============ */
const POL_STEPS = [
  { n: 'Выборы в горсовет', title: 'Кандидат', thr: 50, gap: 20 },
  { n: 'Выборы в парламент региона', title: 'Депутат горсовета', thr: 55, gap: 20 },
  { n: 'Президентские выборы Республики Аркадия', title: 'Депутат региона', thr: 60, gap: 25 }
];
DAILY.push(() => {
  if (S.stage !== 9) return;
  const p = S.pol;
  p.appr = clamp(p.appr - 0.8);
  const r = Math.random();
  if (r < 0.07) { p.appr = clamp(p.appr - 6); say('📰 Журналисты раскопали старую историю. Рейтинг -6.', 'bad'); }
  else if (r < 0.14) { p.appr = clamp(p.appr + 5); say('📰 Твоя инициатива понравилась людям. Рейтинг +5.', 'good'); }
  if (S.day >= p.next) holdElection();
});
function holdElection() {
  const p = S.pol, st = POL_STEPS[p.lvl];
  const score = p.appr + rand(-8, 8);
  if (score >= st.thr) {
    p.lvl++; note('success');
    if (p.lvl >= 3) { enterState(); return; }
    p.next = S.day + POL_STEPS[p.lvl].gap;
    say('🗳️ Победа на выборах! Теперь: ' + POL_STEPS[p.lvl].title + '.', 'good');
    M.fn = () => '<h2>🗳️ Победа!</h2><p>' + st.n + ' выиграны. Рейтинг: ' + Math.round(p.appr) + '%.</p><button class="btn" data-close="1">Дальше</button>';
  } else {
    S.rep = clamp(S.rep - 10); p.appr = Math.max(p.appr, 45); p.next = S.day + 10;
    say('🗳️ Поражение на выборах (' + Math.round(score) + '% при проходном ' + st.thr + '%). Новая попытка через 10 дней.', 'bad'); note('error');
    M.fn = () => '<h2>🗳️ Поражение</h2><p>Нужно было ' + st.thr + '%, а получилось ' + Math.round(score) + '%. Репутация -10. Следующая попытка через 10 дней.</p><button class="btn" data-close="1">Понял</button>';
  }
}
function polView() {
  const p = S.pol, st = POL_STEPS[Math.min(2, p.lvl)], nw = netWorth();
  const ad = Math.max(1e6, nw * 0.002);
  let h = box('<b>🗳️ ' + st.title + '</b><div class="muted">Следующее: ' + st.n + ' через ' + Math.max(0, p.next - S.day) + ' дн. · нужно ≥' + st.thr + '%<br>Рейтинг одобрения: <b>' + Math.round(p.appr) + '%</b> · репутация ' + Math.round(S.rep) + '</div>');
  h += grid([
    B('📢', 'Митинг', '3 ч, рейтинг +4..7', () => { if (!tick(3, 'out')) return; p.appr = clamp(p.appr + rand(4, 7)); moodUp(-4); S.did.rally = 1; say('📢 Митинг собрал толпу.', 'good'); }, !S.did.rally && S.energy >= 20, S.did.rally ? 'Сегодня уже' : 'Нет сил'),
    B('🎙️', 'Дебаты', '2 ч, риск', () => {
      if (!tick(2, 'out')) return; S.did.debate = 1;
      if (Math.random() < 0.5 + 0.2 * (S.rep - 50) / 50) { p.appr = clamp(p.appr + 8); say('🎙️ Блестящие дебаты! +8%.', 'good'); } else { p.appr = clamp(p.appr - 3); say('🎙️ Дебаты прошли неудачно. -3%.', 'bad'); }
    }, !S.did.debate, 'Сегодня уже'),
    B('📺', 'Реклама', mny(ad) + ', +6%', () => { if (!pay2(ad)) return; p.appr = clamp(p.appr + 6); S.did.ad = 1; say('📺 Рекламная кампания в эфире.', 'good'); }, !S.did.ad && rub() >= ad, S.did.ad ? 'Сегодня уже' : 'Нужно ' + mny(ad)),
    B('🎭', 'Благотворительный вечер', mny(ad) + ', +4% и репутация', () => { if (!pay2(ad)) return; p.appr = clamp(p.appr + 4); S.rep = clamp(S.rep + 5); S.did.gala = 1; say('🎭 Вечер удался.', 'good'); }, !S.did.gala && rub() >= ad, S.did.gala ? 'Сегодня уже' : 'Нужно ' + mny(ad)),
    B('🗂️', 'Компромат на соперника', 'риск 40%', () => {
      S.did.dirt = 1;
      if (Math.random() < 0.6) { p.appr = clamp(p.appr + 10); say('🗂️ Скандал у соперника. Тебе +10%.', 'good'); } else { p.appr = clamp(p.appr - 10); S.rep = clamp(S.rep - 15); say('🗂️ Компромат слили против тебя. -10% и репутация -15.', 'bad'); }
    }, !S.did.dirt, 'Сегодня уже'),
    B('⏩', 'Ждать неделю', '7 дней', () => waitDays(7))
  ]);
  return h;
}
TABS.politics = { ic: '🗳️', n: 'Политика', from: 9, to: 9, view: polView };

GOALS[9] = () => ({
  items: [
    { t: POL_STEPS[Math.min(2, S.pol.lvl)].n, v: 'через ' + Math.max(0, S.pol.next - S.day) + ' дн.' },
    { t: 'Рейтинг одобрения', cur: Math.round(S.pol.appr), need: POL_STEPS[Math.min(2, S.pol.lvl)].thr }
  ]
});

/* ---------- ГЛАВА ГОСУДАРСТВА ---------- */
function enterState() {
  S.st = { treasure: 50, people: 50, army: 50, science: 50, space: S.corps.includes('space') ? 10 : 0, card: null };
  S.housing = 7;
  setStage(10);
}
const BARS = { treasure: ['🏦', 'Казна'], people: ['👥', 'Народ'], army: ['🛡️', 'Армия'], science: ['🔬', 'Наука'] };
function fxHint(fx) {
  return Object.keys(fx).map(k => BARS[k][0] + (fx[k] > 0 ? (fx[k] >= 10 ? '⬆️' : '↑') : (fx[k] <= -10 ? '⬇️' : '↓'))).join(' ');
}
function stateChoose(side) {
  const c = CARDS[S.st.card], ch = c[side], fx = ch[1], sp = ch[2] || 0;
  for (const k in fx) S.st[k] = clamp(S.st[k] + fx[k]);
  S.st.space = clamp(S.st.space + sp, 0, 100);
  S.st.space = clamp(S.st.space + (0.35 + Math.max(0, (S.st.science - 40) / 22)) * (S.corps.includes('space') ? 1.3 : 1), 0, 100);
  S.st.card = null; S.hour = 8; newDay();
  say(c.who + ' ' + ch[0] + '.');
  const dead = Object.keys(BARS).find(k => S.st[k] <= 0);
  if (dead) {
    S.rep = clamp(S.rep - 20); S.cash.RUB = Math.round(S.cash.RUB / 2); S.housing = 6;
    S.st = { treasure: 50, people: 50, army: 50, science: 50, space: 0, card: null };
    fall(8, 'Отставка: шкала «' + BARS[dead][1] + '» упала до нуля. Ты потерял власть и половину наличных.');
    return;
  }
  if (S.st.space >= 100) { S.over = { type: 'win' }; note('success'); finishRun(); }
}
function stateView() {
  if (S.st.card == null) S.st.card = rand(0, CARDS.length - 1);
  const c = CARDS[S.st.card];
  let h = box('<b>🚀 Космическая программа: ' + Math.floor(S.st.space) + '%</b><div class="muted">Наука и решения двигают проект. Любая шкала на нуле означает отставку.</div>');
  h += '<div class="reign"><div class="who">' + c.who + '</div><div class="tx">' + c.t + '</div></div>';
  h += grid([
    B('◀️', c.L[0], fxHint(c.L[1]), () => stateChoose('L')),
    B('▶️', c.R[0], fxHint(c.R[1]), () => stateChoose('R'))
  ]);
  return h;
}
TABS.state = { ic: '👑', n: 'Госдело', from: 10, to: 10, view: stateView };
GOALS[10] = () => ({ items: [{ t: 'Космическая программа', cur: Math.floor(S.st.space), need: 100 }] });

/* --- 09_rating.js --- */
/* ===================== РЕЙТИНГ ===================== */
const R = { top: null, loading: false, err: '', sent: 0 };
function userName() {
  const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  return u ? (u.first_name || u.username || 'Игрок') : 'Игрок';
}
async function submitScore(force) {
  if (!API_URL || !tg || !tg.initData || !S) return;
  const now = Date.now();
  if (!force && now - R.sent < 15000) return;
  R.sent = now;
  try {
    await fetch(API_URL + '/submit', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: tg.initData, score: calcScore(), stage: S.stage, days: S.day, net: Math.round(netWorth()) })
    });
  } catch (e) {}
}
async function fetchTop() {
  if (!API_URL) return;
  R.loading = true; R.err = ''; render();
  try { const r = await fetch(API_URL + '/top'); R.top = await r.json(); }
  catch (e) { R.err = 'Не удалось загрузить рейтинг'; }
  R.loading = false; render();
}
function ratingView() {
  const sc = calcScore();
  let h = box('<b>🏆 Твой результат</b><div class="muted">Очки: <b style="color:var(--gold)">' + fmt(sc) + '</b> · этап ' + S.stage + ' (' + STAGES[S.stage].n + ') · день ' + S.day + '<br>Капитал: ' + mny(netWorth()) + '<br>Лучший забег: ' + (META.best ? fmt(META.best.score) + ' очков, этап ' + META.best.stage + ', день ' + META.best.day : 'ещё нет') + ' · забегов: ' + META.runs + ' · побед: ' + META.wins + '</div>');
  h += '<div class="muted" style="margin-bottom:6px">Очки = этап × 10 000 + логарифм капитала − дни. Чем быстрее поднимаешься, тем выше.</div>';
  h += grid([
    B('📤', 'Отправить результат', API_URL ? 'в общий рейтинг' : 'рейтинг не подключён', () => { submitScore(true).then(fetchTop); toast('Отправлено'); }, !!API_URL && !!(tg && tg.initData), 'Нужен сервер рейтинга и запуск из Telegram'),
    B('🔄', 'Обновить таблицу', '', fetchTop, !!API_URL, 'Нужен сервер рейтинга')
  ]);
  if (!API_URL) h += box('Общий рейтинг включится, когда подключишь сервер (папка <b>server</b>, инструкция в README). Пока работает личный рекорд.');
  else if (R.loading) h += box('Загружаю...');
  else if (R.err) h += box(R.err);
  else if (R.top) {
    h += sec('Топ игроков');
    h += R.top.map((r, i) => '<div class="row2"><div class="nm"><b>' + (i + 1) + '. ' + String(r.name || 'Игрок').replace(/[<>&]/g, '') + '</b><small>' + (STAGES[r.stage] ? STAGES[r.stage].ic + ' ' + STAGES[r.stage].n : '') + ', день ' + r.days + '</small></div><b style="color:var(--gold)">' + fmt(r.score) + '</b></div>').join('') || box('Пока никого.');
  }
  return h;
}
TABS.rating = { ic: '🏆', n: 'Рейтинг', from: 1, to: 10, view: ratingView };

/* --- 10_main.js --- */
/* ===================== ОТРИСОВКА И ЗАПУСК ===================== */
function act(fn) {
  if (!S || S.over || !S.intro) return;
  try { fn(); } catch (e) { console.error(e); toast('Ошибка: ' + e.message); }
  if (S.hp <= 0 && !S.over) collapse();
  save(); render();
}
function goTab(id) {
  if (!S || S.over) return;
  if (S.stage === 1 && STREET.includes(id) && id !== S.loc) {
    act(() => { if (!tick(1, 'out')) return; S.loc = id; S.tab = id; say('Дошёл: ' + LOCS[id].n + '.'); maybeEvent(0.15); });
    return;
  }
  S.tab = id; if (S.stage === 1 && STREET.includes(id)) S.loc = id;
  save(); render();
}
function statsHTML() {
  let bars;
  if (S.stage >= 10) bars = Object.keys(BARS).map(k => ({ v: S.st[k], ic: BARS[k][0], n: BARS[k][1], c: { treasure: '#f59e0b', people: '#38bdf8', army: '#ef4444', science: '#a3e635' }[k] }));
  else {
    bars = [
      { v: S.hp, ic: '❤️', n: 'Здоровье', c: '#ef4444' },
      { v: S.food, ic: '🍞', n: 'Сытость', c: '#f59e0b' },
      S.stage === 1 ? { v: S.warm, ic: '🔥', n: 'Тепло', c: '#38bdf8' } : { v: S.mood, ic: '🙂', n: 'Настроение', c: '#c084fc' },
      { v: S.energy, ic: '⚡', n: 'Бодрость', c: '#a3e635' }
    ];
  }
  return bars.map(b => { const v = Math.round(b.v); return '<div class="stat' + (v < 25 ? ' low' : '') + '"><div class="row"><span>' + b.ic + ' ' + b.n + '</span><b>' + v + '</b></div><div class="bar"><i style="width:' + v + '%;background:' + b.c + '"></i></div></div>'; }).join('');
}
function goalHTML() {
  const gf = GOALS[S.stage]; if (!gf) return '';
  const g = gf();
  let h = '<div class="goalbox"><div class="gt">Цель этапа</div>';
  for (const it of g.items) {
    if (it.cur !== undefined) {
      const pct = Math.min(100, it.cur / it.need * 100);
      h += '<div class="gi ' + (pct >= 100 ? 'done' : '') + '"><span>' + (pct >= 100 ? '✓' : '○') + ' ' + it.t + '</span><div class="pb"><i style="width:' + pct + '%"></i></div><span class="v">' + (it.money ? fmt(it.cur) + ' / ' + fmt(it.need) + ' ₽' : Math.floor(it.cur) + ' / ' + it.need) + '</span></div>';
    } else h += '<div class="gi ' + (it.done ? 'done' : '') + '"><span>' + (it.done ? '✓' : '○') + ' ' + it.t + '</span><span class="v">' + (it.v || '') + '</span></div>';
  }
  if (g.btn && g.can) h += '<div class="acts" style="margin:8px 0 0">' + B('⭐', g.btn, 'Условия выполнены', () => g.go(), true, '', 'win big') + '</div>';
  return h + '</div>';
}
function walletModal() {
  let h = '<h2>💰 Кошелёк</h2><div class="item"><span class="ic">₽</span><div class="tx">Рубли<small>' + mny(S.cash.RUB) + '</small></div></div>';
  for (const c of ['USD', 'EUR', 'CNY']) if (S.cash[c] > 0 || S.stage >= 4) h += '<div class="item"><span class="ic">' + SYM[c] + '</span><div class="tx">' + CUR_NAMES[c] + '<small>' + S.cash[c].toFixed(0) + ' ' + SYM[c] + ' = ' + mny(S.cash[c] * S.fx.r[c]) + '</small></div></div>';
  if (S.deposit > 0) h += '<div class="item"><span class="ic">🏦</span><div class="tx">Вклад<small>' + mny(S.deposit) + '</small></div></div>';
  if (S.debt > 0) h += '<div class="item"><span class="ic">⚠️</span><div class="tx">Долг<small>' + mny(S.debt) + '</small></div></div>';
  h += '<p>Капитал: <b>' + mny(netWorth()) + '</b><br>Очки рейтинга: <b>' + fmt(calcScore()) + '</b></p>';
  h += '<button class="btn" data-close="1">Закрыть</button><button class="btn alt" id="resetBtn">Начать игру заново</button>';
  return h;
}
function render() {
  if (!S) return;
  CUR = [];
  const st = STAGES[S.stage];
  $('#stage').textContent = st.ic + ' ' + st.n;
  $('#clock').textContent = 'День ' + S.day + ' · ' + pad(Math.floor(S.hour)) + ':' + (S.hour % 1 ? '30' : '00');
  $('#wallet').textContent = '💰 ' + fmt(rub()) + ' ₽';
  $('#stats').innerHTML = statsHTML();
  $('#goal').innerHTML = goalHTML();
  const lg = $('#log');
  lg.innerHTML = S.log.slice(-6).map(l => '<div class="' + l.cls + '">' + l.t + '</div>').join('') || '<div>Новый день...</div>';
  lg.scrollTop = lg.scrollHeight;
  const tabs = tabsNow();
  if (!tabs.includes(S.tab)) S.tab = tabs[0];
  $('#view').innerHTML = TABS[S.tab].view();
  $('#nav').innerHTML = tabs.map(id => '<button data-tab="' + id + '" class="' + (id === S.tab ? 'on' : '') + '"><span>' + TABS[id].ic + '</span><small>' + TABS[id].n + '</small></button>').join('');
  const nb = $('#nav button.on'); if (nb && nb.scrollIntoView) T(() => nb.scrollIntoView({ block: 'nearest', inline: 'center' }));
  const md = $('#modal');
  if (M.fn) { $('#modalBody').innerHTML = M.fn(); md.classList.add('show'); } else md.classList.remove('show');
  renderOver();
}
const EPI = ['Зима не прощает ошибок.', 'Улица жестока, но справедлива.', 'Даже у дна есть дно.', 'Весна пришла без тебя.'];
function renderOver() {
  const o = $('#over');
  if (!S.intro) {
    o.innerHTML = '<div class="sheet"><h2>🧥 Бомжара: путь наверх</h2><p>Начинаешь с улицы. Нужно восстановить паспорт, снять комнату и пойти вверх по лестнице жизни.</p><p>Десять этапов: от «Без адреса» до главы государства и космоса. По пути школа, вуз, карьера, бизнес, биржа, выборы, обменник с плавающим курсом и казино.</p><p>Следи за здоровьем, сытостью, теплом (позже настроением) и бодростью. Падать вниз можно, и это не конец.</p><button class="btn" id="startBtn">Начать</button></div>';
    o.classList.add('show'); return;
  }
  if (!S.over) { o.classList.remove('show'); return; }
  const w = S.over.type === 'win';
  o.innerHTML = '<div class="sheet"><h2>' + (w ? '🚀 Ракета ушла в космос!' : '💀 Ты ' + S.over.why) + '</h2><p>' +
    (w ? 'От ночлежки до космодрома. Страна запомнит тебя.' : EPI[S.day % EPI.length]) +
    '</p><p>Дней: <b>' + S.day + '</b><br>Очки: <b>' + fmt(calcScore()) + '</b><br>Капитал: <b>' + mny(netWorth()) + '</b></p>' +
    '<button class="btn" id="againBtn">Играть заново</button><button class="btn alt" id="shareBtn">Поделиться</button></div>';
  o.classList.add('show');
}
function share() {
  const w = S.over && S.over.type === 'win';
  const txt = w ? 'Я прошёл путь от бездомного до космоса за ' + S.day + ' дн.! Сможешь быстрее?' : 'Я дошёл до этапа «' + STAGES[S.stage].n + '» за ' + S.day + ' дн. Сможешь выше?';
  const link = 'https://t.me/share/url?url=' + encodeURIComponent(SHARE_URL || location.href) + '&text=' + encodeURIComponent(txt);
  if (tg && tg.openTelegramLink) { try { tg.openTelegramLink(link); return; } catch (e) {} }
  window.open(link, '_blank');
}
function newGame() { S = fresh(); S.intro = true; M.fn = null; save(); render(); }

document.addEventListener('click', e => {
  if (!S) return;
  const t = e.target;
  if (t.closest('[data-close]')) { M.fn = null; render(); return; }
  const b = t.closest('button[data-i]');
  if (b) { if (!b.disabled) { const f = CUR[+b.dataset.i]; if (f) { hap(); act(f); } } return; }
  const n = t.closest('#nav button'); if (n) { hap(); goTab(n.dataset.tab); return; }
  if (t.closest('#wallet')) { M.fn = walletModal; render(); return; }
  if (t.id === 'modal') { M.fn = null; render(); return; }
  if (t.id === 'resetBtn') { if (confirm('Начать игру заново? Прогресс этого забега пропадёт.')) newGame(); return; }
  if (t.id === 'startBtn') { S.intro = true; save(); render(); return; }
  if (t.id === 'againBtn') { newGame(); return; }
  if (t.id === 'shareBtn') { share(); return; }
});

function mergeDeep(base, src) {
  if (!src || typeof src !== 'object') return base;
  for (const k in src) {
    if (src[k] && typeof src[k] === 'object' && !Array.isArray(src[k]) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) mergeDeep(base[k], src[k]);
    else base[k] = src[k];
  }
  return base;
}
loadMeta();
loadSave(saved => {
  S = mergeDeep(fresh(), saved);
  render();
  if (API_URL) fetchTop();
});

</script>
